# Baut den Installer und veröffentlicht ihn als GitHub-Release, sobald ein Versions-Tag (z. B. v0.2.0) gepusht wird.
# Die installierten GTA-Tool-Versionen finden das Release automatisch (electron-updater, latest.yml).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version prüfen (Tag = package.json)
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($pkg -ne $tag) { throw "Tag v$tag passt nicht zur Version $pkg in package.json" }

      - run: npm ci

      - name: Installer bauen und veröffentlichen
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
